name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'src/**'
      - 'params.yaml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc GCP bang Workload Identity Federation (keyless), pull du lieu bang
  # DVC, huan luyen mo hinh, upload model len GCS.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: mlops-lab-sa@project-7df9f963-9fe0-4b76-b3d.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Pull data with DVC
        run: dvc pull

      - name: Check MLflow tracking target
        run: |
          if [ -z "$MLFLOW_TRACKING_URI" ] || [ -z "$MLFLOW_TRACKING_USERNAME" ] || [ -z "$MLFLOW_TRACKING_PASSWORD" ]; then
            echo "DagsHub MLflow secrets are incomplete."
            exit 1
          fi
          echo "Using remote MLflow tracking: $MLFLOW_TRACKING_URI"

      - name: Train model
        env:
          MLFLOW_EXPERIMENT_NAME: wine-quality
        run: python src/train.py

      - name: Compare multiple algorithms in MLflow
        env:
          MLFLOW_EXPERIMENT_NAME: wine-quality
        run: python src/compare_models.py

      - name: Read metrics
        id: read_metrics
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> "$GITHUB_OUTPUT"

      - name: Compare with deployed model
        run: |
          if gsutil -q stat gs://${{ secrets.CLOUD_BUCKET }}/metrics/latest/metrics.json; then
            gsutil cp gs://${{ secrets.CLOUD_BUCKET }}/metrics/latest/metrics.json /tmp/previous_metrics.json
            python - <<'EOF'
          import json

          with open("outputs/metrics.json") as current_file:
              current = json.load(current_file)
          with open("/tmp/previous_metrics.json") as previous_file:
              previous = json.load(previous_file)
          current_accuracy = float(current["accuracy"])
          previous_accuracy = float(previous["accuracy"])
          print(f"Current accuracy: {current_accuracy:.6f}")
          print(f"Deployed accuracy: {previous_accuracy:.6f}")
          if current_accuracy < previous_accuracy:
              raise SystemExit("FAILED: new model is worse; deployment cancelled.")
          print("PASSED: new model is not worse than the deployed model.")
          EOF
          else
            echo "No previous metrics found; accepting the first model."
          fi

      - name: Save model metrics and report
        run: |
          gsutil cp models/model.pkl gs://${{ secrets.CLOUD_BUCKET }}/models/latest/model.pkl
          gsutil cp outputs/metrics.json gs://${{ secrets.CLOUD_BUCKET }}/metrics/latest/metrics.json

      - name: Save metrics and report as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: |
            outputs/metrics.json
            outputs/report.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # Kiem tra nguong chat luong (accuracy >= 0.68).
  # Nguong 0.68 duoc dung vi RandomForest tot nhat tren 2998 mau dat ~0.686.
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        env:
          ACCURACY: ${{ needs.train.outputs.accuracy }}
        run: |
          python - <<'EOF'
          import os
          acc = float(os.environ["ACCURACY"])
          print(f"Accuracy: {acc:.4f}")
          if acc < 0.68:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < 0.68. Huy deploy.")
          print("PASSED: accuracy >= 0.68, dang trien khai model.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # Trien khai len VM qua SSH (nhu huong dan buoc-2): restart service,
  # cho server san sang va kiem tra /health.
  # Chi chay khi Job 3 (Eval) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sudo systemctl restart mlops-serve
            for i in $(seq 1 15); do
              if curl -sf http://localhost:8000/health; then
                echo "DEPLOY_OK"
                exit 0
              fi
              sleep 3
            done
            echo "HEALTH_CHECK_FAILED"
            exit 1
